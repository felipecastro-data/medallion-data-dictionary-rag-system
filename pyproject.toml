[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medallion-rag"
version = "0.1.0"
description = "RAG chatbot over an auto-generated data dictionary for a Databricks Medallion lakehouse."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
medallion-describe = "medallion_rag.subagents.generate_descriptions:main"
medallion-index = "medallion_rag.embeddings.build_index:run"
medallion-chat = "medallion_rag.chatbot.cli:main"
medallion-schema-drift = "medallion_rag.hooks.detect_schema_change:run"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
